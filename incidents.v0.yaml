  - id: 2019-06-24-synthetix-skrw
    date: 2019-06-24
    date_precision: day
    chain: ethereum
    protocol: Synthetix
    asset_or_feed: sKRW 汇率 feed
    oracle_type: 官方私有 oracle（多商业 API 聚合）
    root_cause_class: upstream_feed_error
    loss_usd_estimate: [0, 0]           # 未实现损失：全部追回
    exposure_notional: "37M sETH 被错误铸造给套利机器人（名义敞口约 $1B 量级，见 cointelegraph 报道口径）"
    recovered: full                      # 机器人所有者以 bug bounty 换取全额回滚
    description: >
      一家商业 FX API 间歇性把 KRW 价格报高 1000 倍。正常情况下 outlier 剔除机制可吸收，
      但当时另一路 API 因无关故障停服且未被异常上报捕获，oracle 对仅剩的两路取平均，
      把错误价写进汇率合约。自动套利机器人发现并转换为 sETH。官方停机回滚，机器人以
      bug bounty 交换归还。
    attack_cost: "零（无攻击者，纯 feed 故障 + 冗余降级）"
    mechanism_note: "冗余设计在'同时降级到 2 路'时失效——平均不是中位数，outlier 剔除没有兜底"
    outcome: 全额追回，平台停机数小时，事后增加 feed 冗余与异常处理
    dispute_status: resolved
    confidence: multi-source-verified
    amount_recompute: none-applicable   # 无攻击 tx（feed 故障类），损失全额追回，复算不适用

  - id: 2026-03-10-aave-capo-wsteth
    date: 2026-03-10
    date_precision: day
    chain: ethereum
    protocol: Aave
    asset_or_feed: wstETH（CAPO 风险 oracle 配置）
    oracle_type: Chainlink feed + CAPO（caps/rate 限幅器）
    root_cause_class: wrapper_config_error
    loss_usd_estimate: [26000000, 27000000]
    description: >
      CAPO 限幅 oracle 配置错位使 wstETH 链上价低于市场约 2.85%，触发约
      10,938 wstETH（$26-27M）清算（34 个账户，E-Mode 杠杆仓位），清算人获利约 499 ETH，
      协议零坏账。官方复盘（Chaos Labs，governance.aave.com + X 长文）机制：
      链下风险 oracle 试图把 snapshotRatio 从 ~1.1572 更新到 7 天前的汇率 1.2282，
      但链上规则限制比率每 3 天最多涨 3%（只能到 1.1919），而 snapshotTimestamp
      没有此限制、直接跳到 7 天前——低比率配新时间戳，CAPO 公式从过低参考点外推，
      算出 ~1.1939 vs 真实 ~1.228。风险 Steward 止血：wstETH 借款 cap 降到 1 +
      手动对齐 snapshotRatio 与时间戳。赔付：BuilderNet 退款回收 141.5 ETH +
      最多 345 ETH DAO 金库，受影响用户全额获偿。
    recovered: n-a                             # 清算是市场行为，无"追回"概念；用户获 DAO 全额赔付方案
    attack_cost: "零（配置语义错误 + 清算激励照常运转）"
    mechanism_note: "限幅器/包装器本为保护设计，配置错误时反而制造价格偏差——且偏差在'安全'阈值内被当作正常；同一参数对（ratio/timestamp）受两套不同更新约束＝错位是结构性的"
    outcome: 全额赔付方案公布；官方复盘完整（governance.aave.com）
    dispute_status: resolved-official-postmortem
    confidence: primary-disclosure-verified   # Chaos Labs 官方 post-mortem
    amount_recompute: none-applicable   # 配置错误类，清算为市场行为，10,938 wstETH/-27M 为官方复盘口径
    sources:
      - {url: "https://governance.aave.com/t/post-mortem-exchange-rate-misalignment-on-wsteth-core-and-prime-instances/", tier: primary, accessed: 2026-10-11}

      - {url: "https://cointelegraph.com.cach3.com/news/synthetix-reverses-oracle-error-caused-misplaced-seth-in-exchange-for-a-bug-bounty/", tier: secondary, accessed: 2026-10-11}
      - {url: "https://quadrigainitiative.com/casestudy/synthetixoracletheftincident.php", tier: secondary, accessed: 2026-10-11}

  - id: 2026-09-04-vesu-pragma
    date: 2026-09-04
    date_precision: day
    chain: starknet
    protocol: Vesu
    asset_or_feed: Pragma 上游喂价（BTC/WBTC/ETH/STRK/USDC/wstETH）
    oracle_type: Pragma（非 EVM 生态 oracle）
    root_cause_class: upstream_feed_error
    loss_usd_estimate: [737914, 737914]      # 官方复盘口径：借款人权益损失 $737,914；池吸收坏账 $657,387
    exposure_notional: "~$3M 抵押品被清算人取走（47 仓位/42 钱包/7 池）"
    description: >
      Pragma 发布管道故障，2026-09-04 04:07:52–04:40 UTC 间约 109 秒内把多资产
      （BTC、WBTC、ETH、STRK、USDC 及滞后的 wstETH）价格报到约为真实市值一半。
      04:08:16–04:10:04 间 47 个仓位（42 个借款钱包、7 个池）被无许可清算机器人清算。
      官方复盘定性：Vesu 合约零漏洞——清算算术/记账/坏账处理全部按规格运行；
      失效点是外部输入，且 Vesu 链上价格校验无法捕获（校验所依据的元数据本身错误）。
    recovered: 95%（按 09-11 价格口径；93% 按事发当日价；退款由池策展人处理）
    attack_cost: "零（无攻击者，上游 feed 故障 + 清算激励照常运转）"
    mechanism_note: "喂价校验的信任根也依赖喂价——元数据错误时验证形同虚设；109 秒足够完成一次完整清算周期"
    outcome: 95% 资产已回收；Pragma 已部署根因修复；受影响池曾暂停
    dispute_status: resolved-partial-recovery
    confidence: primary-disclosure-verified   # Vesu 官方复盘（2026-09-22 发布），数字为协议自报权威口径
    amount_recompute: none-applicable   # Starknet 非 EVM，官方复盘数字即权威口径
    notes: "playbook 判定：非 EVM 不做还原样本，仅作争议举证方向的话题案例"
    sources:

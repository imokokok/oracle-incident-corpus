# Oracle 事故语料库 v1.0.0
# 生成日期：2026-10-11（v0.2 同日链上核验 pass；v0.3 同日第二轮：官方披露升级 + UWU 日期链上纠错）。
# v1.0.0：2026-10-12 金额链上复算 pass —— 8 条目 / 12 tx 的 tx-receipt 日志级复算
#   （ERC-20 Transfer 聚合 + 原生币余额差分 + DefiLlama 攻击块时点价）。
# 维护者：insight（oracleinsight.xyz）。
# 结构化、版本化、带出处的事故记录。每条记录：根因分类 + 损失量纲 + 攻击成本（可得时）+ 复盘链接。
#
# 置信分级（confidence 字段）：
#   tx-hash-chain-verified  —— 攻击 tx 已在链上实测（eth_getTransactionReceipt 存在 +
#       status=success + 区块时间戳与记录日期吻合，publicnode/drpc/llamarpc/ankr，2026-10-11）；
#       注意：这只钉住"攻击发生在该日"，损失金额仍是二手口径
#   primary-disclosure-verified —— 协议官方复盘（postmortem / 官方披露）为权威口径，
#       数字以官方自报为准；无 tx 可验的场景（配置错误/上游故障类）的核验天花板
#   multi-source-verified  —— 多个独立二手源交叉吻合（本 v0 经 2026-10-11 检索核实）
#   single-secondary-source —— 仅单一二手源，未交叉核验
#   playbook-secondary-pending-primary —— 来自 10-10 playbook（单一 newsletter 聚合源转述），
#       动手使用前须以协议治理论坛原始帖与链上记录双向核验（playbook 第 72 行纪律）
#
# 金额复算分级（amount_recompute 字段，2026-10-12 v1 新增）：
#   confirmed       —— 借出/窃取资产在 tx 日志级逐项复现，数量与记录口径吻合
#   token-confirmed —— 资产数量复现，但 USD 计价受操纵时点价影响，名义口径分层保留
#   refined         —— 复算数量与记录同量级但低于口径（部分 token 无法计价），两级数字并列
#   partial         —— 仅记录 tx 范围内可复算（利润经多 tx/多地址流出，超出记录范围）
#   flagged         —— 复算值与记录口径冲突超 2 倍，须人工仲裁后才可使用
#   none-applicable —— 无攻击 tx（feed 故障/配置错误类）或非 EVM，复算不适用
#
# 已知局限（缺口显式列出，不掩盖）：
#   1. 核验状态（2026-10-11 两轮后）：tx 链上核验 8/15 条目（12 个 tx）；官方披露核验 3/15
#      （vesu/moonwell/aave-capo）；Mango 达到"账户-程序归属核验"（攻击账户存活且属
#      Mango v3 程序，2021 签名超出公共 RPC 历史窗口）；sentiment tx 为多源一致引用
#      但 5 端点 RPC 未复现（诚实标注于条目内）；synthetix 为 feed 故障类（无攻击 tx，
#      多源即该类天花板）；hyperliquid 为非 EVM 链（多源+日精度为现可达上限）。
#      v1 起金额复算见各条 amount_recompute 字段与方法注记（meta.amount_recompute_method）。
#   2. 名义损失（nominal）与实际变现（realized）经常相差 1-2 个数量级（见 bonqdao），
#      loss_usd_estimate 是名义口径，除非字段另注；realized 仍为二手/官方口径（未复算）。
#   3. 分类法是 v0 提案，10 类 × 15 条，可能过拟合；积累到 30+ 条后再收敛。
#   4. 检索发现已存在通用型结构化 hack 数据库（iTokenly Hack Registry，CC BY 4.0）——
#      本语料库的差异化 = oracle 专一 curation + 攻击成本字段 + 金额链上复算 + ML 就绪结构 + 签名出处（PriorSeal）。
#   5. 日期精度 date_precision=month 的条目未核实到具体日。

meta:
  version: 1.0.0
  generated: 2026-10-11
  onchain_verified_pass: 2026-10-11   # round 1: 8 tx / 6 entries; round 2: +4 tx / +2 entries (uwu, resolv) + mango account check
  amount_recompute_pass: 2026-10-12   # 8 条目 / 12 tx：receipt 日志级代币流聚合 + 原生币余额差分 + DefiLlama 攻击块时点价
  amount_recompute_method: >
    scripts/recompute-v1.mjs（receipt ERC-20 Transfer 日志按 attacker 地址聚合 + eth_getBalance

  - id: 2023-02-01-bonqdao
    date: 2023-02-01
    date_precision: day
    chain: polygon
    protocol: BonqDAO
    asset_or_feed: WALBT（TellorFlex 报价）
    oracle_type: 去中心化 oracle 网络（Tellor）+ 无延迟消费
    root_cause_class: oracle_submit_underpriced
    loss_usd_estimate: [88000000, 120000000]  # Numen 链上口径 $88M；Immunefi 口径 $120M
    realized_usd_estimate: [1200000, 1600000] # The Block 口径售出 ~$1.2M；AllianceBlock 称实际损失 ~$1.6M
    recovered: none
    description: >
      BonqDAO 用 Tellor 报价作为 WALBT 抵押价，且用 getCurrentValue 立即生效（无延迟无平均）。
      攻击者质押 10 TRB 获得报价权，把 WALBT 报到天价（约 10 倍），用 0.1 WALBT 借出 1 亿 BEUR；
      数分钟后反向报近零价清算他人 trove，获取 ~113.8M WALBT。
      名义损失 $88-120M，但因 WALBT/BEUR 几乎无流动性，攻击者实际变现仅 ~$1.2-1.6M。
      攻击者为绕过报价时间锁，每次报价部署新 reporter 合约（Immunefi 分析）。
    attack_cost: "10 TRB 的质押（成本与 $120M 名义收益完全不成比例——正是操纵成本论点的实证）"
    mechanism_note: "去中心化 oracle ≠ 安全：安全性=提交坏价的成本 vs 收益，整合侧无延迟消费放大一切"
    outcome: 用户获补偿；AllianceBlock 暂停桥并撤流动性
    dispute_status: resolved
    confidence: tx-hash-chain-verified
    amount_recompute: token-confirmed   # 2026-10-12：攻击合约 0xed59…净得 +113,813,985 WALBT（与"~113.8M"逐位吻合）+ 98,658,539 BEUR（与"1 亿"吻合）- 20 TRB（撤回质押）；llama 攻击时点价 WALBT≈$0.105 严重低于名义口径的 ~$1 —— 印证"名义与变现差 1-2 个数量级"，$88-120M 名义 / $1.2-1.6M realized 分层维持
    attacker_address: "0xcAcf2D28B2A5309e099f0C6e8C60Ec3dDf656642"
    onchain_evidence:

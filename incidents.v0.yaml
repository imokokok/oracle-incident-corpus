    无 key 原始单位→人读单位→USD）。原始输出存 data/recompute-raw.json 与 data/recompute-priced.json。
    边界：只复算攻击 tx 内/紧后窗口的资产流出（token 级）；realized（后续变现）与追回仍为二手/官方口径。

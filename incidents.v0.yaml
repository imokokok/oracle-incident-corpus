      提走 ~11,400 ETH（$23-25M）。下游放大器：Morpho 等借贷市场用 Resolv 的 NAV oracle
      （事件前 15 小时未更新、仍报 $1.00），脱锚 USR 仍可按面值抵押借款，~$7.77M 敞口被锁。
